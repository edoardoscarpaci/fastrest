# Benchmarks are collected by their own config, never by scripts/unit_tests.sh
# (Plan 028 / Phase 3, P2). Two settings, both load-bearing:
#
#   python_files — the modules are named bench_*.py, not test_*.py, precisely
#     so that a stray `pytest` from the repo root cannot sweep them into a unit
#     run. Collection here is opt-in by pointing pytest at this directory.
#   asyncio_mode — deliberately NOT set. Every benchmark drives its own event
#     loop explicitly (one loop per benchmark, reused across iterations),
#     because asyncio_mode = "auto" would build and tear down a fresh loop per
#     iteration and the harness would measure the loop, not varco.
[pytest]
python_files = bench_*.py
python_functions = test_*
testpaths = .
addopts = -p no:cacheprovider
