# CD — build once, publish all ten varco distributions to PyPI over OIDC
# trusted publishing with PEP 740 attestations.
#
# Plan 023 / Phase 5, design section §RL-10-publish / §RL-10-matrix. Replaces the
# never-run, fully-commented-out `publish.yml` from the 0.1.0 era — `git rm`'d in
# the same commit that added this file.
#
# ⚠️ THE FILENAME IS LOAD-BEARING. A PyPI trusted publisher matches on
# owner + repo + workflow *filename* + environment; renaming this file
# invalidates every one of the ten publisher configs (brief 005 §1). Do not
# rename it without re-doing all ten PyPI-side configs.
#
# DESIGN: three jobs — packages (derive matrix) → build (once per package,
# artifact per package) → publish (matrix over the ten names)
#   ✅ `gh-action-pypi-publish` over `uv publish --trusted-publishing`: emits
#      PEP 740 attestations by default since v1.11.0 with no extra input,
#      and is PyPI's own documented recommendation; `uv publish` emits none
#      (brief 005 §2).
#   ✅ Build-once/publish-later is what the packaging guide *requires* —
#      "building distributions in a publishing job is unsupported" (brief
#      005 §2 citing PyPA's own docs); attestations still work across the
#      job split as long as the publish job holds `id-token: write`.
#   ✅ Package matrix is derived by *executing* `scripts/packages.sh`
#      (Plan 020 / RL-18) — never a hand-written ten-entry YAML list, so an
#      eleventh workspace member needs no edit here.
#   ❌ ~10 extra seconds for the `packages` job. Accepted — same trade
#      `scripts/unit_tests.sh` and `Makefile`'s `PACKAGES` derivation
#      already made.
#
# Two corrections to the brief's own skeleton (brief 005 §4), made explicit
# because the brief's text says the opposite:
#   (1) `packages-dir` MUST be per-package. The brief's own §2 says the
#       action "publishes all .whl and .tar.gz files in the packages-dir",
#       yet its skeleton example passes `dist/` (all ten) on every matrix
#       leg — that would try to upload all ten distributions to each of the
#       ten PyPI projects. Each publish leg here downloads ONLY its own
#       artifact into `dist/`.
#   (2) `environment:` is a JOB-level key, not a step-level one (the
#       brief's skeleton nests it under a step, which is not valid GitHub
#       Actions syntax). Declared at job level here, keyed per matrix leg,
#       for the per-project OIDC scoping brief 005 §1 requires.
#
# Manual, out-of-repo operator steps this workflow depends on (cannot be
# performed by any file in this repo — see
# `design/varco-1-0-release/release-runbook.md`):
#   - Ten GitHub Environments (`pypi-varco-core` … `pypi-varco-casbin`), no
#     deployment-branch restriction.
#   - Ten PyPI trusted-publisher configs: owner `edoardoscarpaci`, repo
#     `varco`, workflow `release.yml`, environment `pypi-<name>`.
#
# ⛔ NEVER select any job in this file as a required status check —
# `release` never runs on `pull_request`, so a required-check selection
# would leave every PR permanently pending (CLAUDE.md §CI).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  packages:
    name: Derive package matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: set-matrix
        name: Build the {dir, name} matrix from scripts/packages.sh
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess

          dirs = subprocess.run(
              ["bash", "scripts/packages.sh"], capture_output=True, text=True, check=True
          ).stdout.split()
          matrix = [{"dir": d, "name": d.replace("_", "-")} for d in dirs]
          print(f"matrix={json.dumps(matrix)}")
          PY

  build:
    name: Build ${{ matrix.package.name }}
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        package: ${{ fromJson(needs.packages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Build (uv build --package <dir>, Makefile:227-228's own invocation shape)
        run: uv build --package ${{ matrix.package.dir }} --out-dir ${{ matrix.package.dir }}/dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package.name }}
          path: ${{ matrix.package.dir }}/dist
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.package.name }}
    needs: [packages, build]
    runs-on: ubuntu-latest
    strategy:
      # A mid-matrix failure is NOT rolled back — nine of ten can succeed
      # while one fails. Re-run only the failed leg (workflow_dispatch);
      # NEVER re-tag. See the release runbook's Edge cases.
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.packages.outputs.matrix) }}
    environment:
      name: pypi-${{ matrix.package.name }}
      url: https://pypi.org/project/${{ matrix.package.name }}/
    permissions:
      id-token: write # required for OIDC trusted publishing — this job only
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.package.name }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
