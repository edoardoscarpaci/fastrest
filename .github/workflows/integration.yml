# CI — integration tests against real brokers via testcontainers.
#
# DESIGN §RL-5-integration (plans/017-ci-green-workflows-and-lint-type-gates.md):
# testcontainers-only, no `services:` blocks.
#   ✅ CI is byte-identical to what a developer runs locally
#      (`make integration-test-clean`) — the same script, the same package
#      list, the same clean-room contract.
#   ✅ Every CI run is a genuine clean-room run — `make integration-test-clean`
#      unsets every `VARCO_TEST_<SERVICE>_URL` override first (Makefile), so
#      the run never silently reuses stale state from a previous job.
#   ✅ Coverage goes to all nine backend packages plus the example suite, in
#      one place (`scripts/integration_tests.sh`) — never duplicated in YAML.
#   ❌ Container startup is serialized inside the job rather than overlapped
#      with a `services:` block's parallel boot. Accepted — this workflow is
#      nightly/main-only, not on the PR critical path.
#
# `services:` blocks are deliberately NOT used here (rejected alternative in
# the design doc above): the repo's conftest fixtures only ever honour the
# namespaced `VARCO_TEST_<SERVICE>_URL` override contract, never a bare
# broker env var name (`KAFKA_BOOTSTRAP_SERVERS`, `REDIS_URL`, `MONGODB_URL`,
# `DATABASE_URL`, ...) — wiring a `services:` block through bare names here
# would silently disarm the "NOT a clean-room run" signal on every CI run,
# which is precisely the run where that signal matters most. Do not
# reintroduce one.
#
# Not a required check for branch protection — `all-green` in test.yml is
# the only one. A nightly integration failure is a BACKLOG/Phase-3 signal,
# not a merge blocker (§RL-5-triggers).

name: Integration Tests

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install workspace (locked)
        run: uv sync --locked --all-packages --all-extras
      - name: Run integration suite (clean-room)
        run: make integration-test-clean
