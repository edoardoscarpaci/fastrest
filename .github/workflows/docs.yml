# Versioned documentation via mike, deployed to the gh-pages branch.
#
# Plan 023 / Phase 6, §RL-12-docs. Two jobs in one file: `dev` tracks `main`,
# `release` tracks a non-pre-release `v*` tag.
#
# DESIGN: see mkdocs.yml's own DESIGN comment for why mike (not the Actions
# artifact model) is the only mechanism available — not restated here.
#
# Version naming: `<major>.<minor>` (`3.0`), no `v`, no patch (brief 006 §5)
# — fixed permanently; changing the scheme later 404s every old URL. Aliases:
# `latest` (moves on each final release) and `dev` (tracks `main`). `stable`
# is deliberately not used.
#
# Pre-release tags (`v3.0.0rc1`, matched by `rc|a|b|dev` in the tag) must
# NEVER move `latest` — the `release` job's `if:` guard below skips entirely
# rather than deploying a release candidate as the default version.
#
# `concurrency: docs-deploy` (shared across both jobs, `cancel-in-progress:
# false`) serializes writes to `gh-pages` — a tag pushed while a `main` push
# is still deploying runs the release deploy AFTER the dev deploy finishes,
# never concurrently.
#
# `fetch-depth: 0` + `uv sync --locked --all-packages --all-extras` (not just
# the `docs` group) are both required: mike needs the full git history to
# manage the gh-pages branch's commits, and mkdocstrings imports the actual
# packages live to render the API reference (brief 006 §6) — a docs-group-
# only install cannot do that.

name: Docs

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions: {}

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  dev:
    name: Deploy dev docs (main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # mike pushes commits to gh-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install workspace (locked, full — mkdocstrings imports packages live)
        run: uv sync --locked --all-packages --all-extras
      - name: git identity for mike's commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Fetch gh-pages if it exists (first-ever deploy creates it)
        run: git fetch origin gh-pages:gh-pages || true
      - name: mike deploy dev
        run: uv run mike deploy --push dev

  release:
    name: Deploy release docs (tag)
    # Skip pre-release tags (rc/a/b/dev suffixes) — they must never move
    # `latest`. `v3.0.0rc1` publishes to PyPI (release.yml) but is invisible
    # to the docs version switcher's default.
    if: >
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref, 'rc') &&
      !contains(github.ref, 'a') &&
      !contains(github.ref, 'b') &&
      !contains(github.ref, 'dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install workspace (locked, full)
        run: uv sync --locked --all-packages --all-extras
      - name: git identity for mike's commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Fetch gh-pages if it exists
        run: git fetch origin gh-pages:gh-pages || true
      - name: Derive <major>.<minor> from the tag
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          major_minor="$(echo "$tag" | cut -d. -f1-2)"
          echo "major_minor=$major_minor" >> "$GITHUB_OUTPUT"
      - name: mike deploy release + update latest alias
        run: uv run mike deploy --push --update-aliases "${{ steps.version.outputs.major_minor }}" latest
      - name: mike set-default latest (idempotent)
        run: uv run mike set-default --push latest
