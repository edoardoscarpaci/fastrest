# RBAC-with-domains model — role assignments and permissions are scoped to a
# domain/tenant.  The request and policy carry a `dom` column; g has three
# args (user, role, domain).  Maps to EnforcementRequest.domain.
[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub, r.dom) && r.dom == p.dom && (r.obj == p.obj || p.obj == "*") && (r.act == p.act || p.act == "*")
