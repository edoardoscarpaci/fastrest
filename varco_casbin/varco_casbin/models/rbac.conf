# RBAC model — role hierarchy via g(_, _).  A subject inherits the permissions
# of any role assigned to it (g, alice, admin).  Supports the wildcard object
# "*" so an admin role can be granted blanket access (p, admin, *, *).
[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && (r.obj == p.obj || p.obj == "*") && (r.act == p.act || p.act == "*")
