# ABAC model — attribute-based access control.  The matcher reads attributes
# off the request object (r.obj.<field>) and subject (r.sub.<field>), which
# varco_casbin populates from EnforcementRequest.object_attrs / subject_attrs
# (see CasbinPolicyEngine._AttrObject).
#
# This default rule: a subject may act on an object it owns, OR if it holds
# the "admin" role.  Override with your own model for richer attribute logic.
[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act, eft

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.obj.owner_id == r.sub.id || "admin" in r.sub.roles
