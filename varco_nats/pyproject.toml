[project]
name          = "varco-nats"
version       = "2.1.0"
description   = "NATS JetStream event bus backend for varco — NatsEventBus built on nats-py"
authors       = [{ name = "edoardo.scarpaci", email = "edoardo.scarpaci@gmail.com" }]
readme        = "README.md"
license       = { text = "Apache-2.0" }
requires-python = ">=3.12"
keywords      = ["fastapi", "nats", "jetstream", "nats-py", "async", "event-bus", "domain-events", "varco"]
classifiers   = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    # Workspace sibling — resolved from the monorepo via [tool.uv.sources] below.
    "varco-core",
    # nats-py is the async NATS / JetStream client used by NatsEventBus.
    # JetStream (durable, at-least-once) is the only delivery layer this
    # package targets — Core NATS pub/sub is intentionally not exposed.
    "nats-py>=2.7",
    # providify is used directly for @Singleton / @PreDestroy on NatsEventBus
    # and for @Configuration / @Provider in varco_nats.dlq (NatsDLQConfiguration).
    # It is already a transitive dep via varco-core but listed here to make the
    # direct usage explicit and to protect against future varco-core decoupling.
    "providify>=1.0.0a0",
    # pydantic-settings is used directly in varco_nats.config for SettingsConfigDict.
    # It is also a transitive dep via varco-core, but listed explicitly here.
    "pydantic-settings>=2.0",
]

[project.urls]
Homepage   = "https://github.com/edoardoscarpaci/varco"
Repository = "https://github.com/edoardoscarpaci/varco/tree/main/varco_nats"
Issues     = "https://github.com/edoardoscarpaci/varco/issues"

[tool.uv.sources]
# Resolve varco-core from the workspace instead of PyPI so editable
# changes are immediately visible without a reinstall.
varco-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # testcontainers spins up a real NATS broker via Docker for integration
    # tests.  Marked with @pytest.mark.integration and skipped by default —
    # run with: pytest -m integration
    # The generic DockerContainer is used (no nats extra) so `uv sync` never
    # fails on a missing testcontainers extra.
    "testcontainers>=4.0",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["varco_nats"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
markers      = [
    "integration: real NATS broker required (disabled by default — use -m integration)",
]
