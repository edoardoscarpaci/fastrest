# Lint + type-check gates, kept byte-identical to what CI enforces.
#
# black was removed in favour of ruff, which now owns BOTH linting and
# formatting (plan 017 / RL-6 made ruff the official linter; the formatter was
# adopted immediately after, superseding that plan's `ruff format` Non-goal).
#
# The switch cost one 618-file reformat sweep, because black formatted to its
# 88-column default while [tool.ruff] pins line-length = 100.  That sweep is a
# single commit listed in .git-blame-ignore-revs, so `git blame` reads through
# it.  Keeping black alongside ruff-format was never an option: two formatters
# with different column budgets fight on every commit.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Bumped to match the root [dependency-groups] lint pin (RL-6, plan 017)
    # — v0.4.1 predates rule codes now referenced in [tool.ruff.lint]
    # (UP046/UP047), so it failed to parse the config at all.
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      # Must run AFTER `ruff` — an autofix can leave a line the formatter then
      # rewraps, and pre-commit runs hooks top-to-bottom within a repo block.
      - id: ruff-format

  # ── Type checking ───────────────────────────────────────────────────────────
  # Runs the SAME command as `make type-check` and as CI's `lint` job, rather
  # than mirrors-mypy.  Two reasons:
  #   ✅ mirrors-mypy installs its own mypy into an isolated pre-commit venv,
  #      which would silently diverge from the `mypy==2.3.1` pin in the root
  #      [dependency-groups] lint group that `uv.lock` and CI resolve.  Going
  #      through `make` guarantees one mypy version everywhere.
  #   ✅ `make type-check` derives its source-dir list from Makefile's PACKAGES,
  #      so adding a workspace member updates lint, CI and this hook at once —
  #      no fourth copy of the package list to drift (see BACKLOG's
  #      package-list-triplication row).
  # ❌ Slower than a file-scoped hook: mypy must see whole packages to resolve
  #    cross-module types, so pass_filenames is false and every commit
  #    type-checks all ten source trees.  Accepted — it is what CI asserts.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (all packages)
        entry: make type-check
        language: system
        pass_filenames: false
        always_run: true

  # ── Per-package test suites ─────────────────────────────────────────────────
  # Each hook runs uv run --package <name> pytest from the repo root so all
  # packages share the single workspace .venv.
  #
  # Integration tests (real Kafka / Redis / MongoDB via testcontainers) are
  # excluded here — they require Docker and are slow.  Run them explicitly:
  #   uv run pytest -m integration

  - repo: local
    hooks:
      - id: pytest-core
        name: pytest (varco_core)
        entry: uv run --package varco-core pytest varco_core/tests --tb=short -q
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: pytest-beanie
        name: pytest (varco_beanie)
        entry: uv run --package varco-beanie pytest varco_beanie/tests --tb=short -q
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: pytest-sa
        name: pytest (varco_sa)
        entry: uv run --package varco-sa pytest varco_sa/tests --tb=short -q
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: pytest-kafka
        name: pytest (varco_kafka)
        entry: uv run --package varco-kafka pytest varco_kafka/tests --tb=short -q
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: pytest-redis
        name: pytest (varco_redis)
        entry: uv run --package varco-redis pytest varco_redis/tests --tb=short -q
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: pytest-fastapi
        name: pytest (varco_fastapi)
        entry: uv run --package varco-fastapi pytest varco_fastapi/tests --tb=short -q
        language: system
        pass_filenames: false
        always_run: true
  
  - repo: local
    hooks:
      - id: pytest-memcached
        name: pytest (varco_memcached)
        entry: uv run --package varco-memcached pytest varco_memcached/tests --tb=short -q
        language: system
        pass_filenames: false
        always_run: true

